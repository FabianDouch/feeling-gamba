version: 1
name: Feeling Gamba MVP Information Architecture
last_updated: "2026-09-02"

purpose:
  summary: >
    Define the MVP app navigation, screen hierarchy, primary user flows, and
    screen-to-data relationships for browsing logged racing and UFC favourite,
    MarketMover, result, field-size, dividend, favourite-performance
    statistics, and source-backed promotion signal data.
  primary_users:
    - App user browsing historical racing and UFC outcomes.
    - Developer/operator monitoring ingestion quality and source completeness.

principles:
  - Start with logged race data and source-backed promotion facts, not stake advice.
  - Make country, date, discipline, and racecourse the primary browsing controls.
  - Show missing market/result data explicitly rather than inventing values.
  - Keep source/debug information available without making it the main user flow.
  - Treat Australian and Hong Kong coverage as visible comparison data in
    Historical Data, Insights, and bet-back candidate scans, with country labels
    available in app filters.
  - Use Supabase app-facing read models for runtime race and insight data; local
    fixtures are development/backfill inputs only.
  - Populate Historical Data and Insights course filters from Supabase rows
    produced by all-domestic AUS/NZ/HK race-day ingestion, not from a hardcoded
    app track list.

navigation:
  app_root:
    entry: insights
    sections:
      race_days:
        label: Historical Data
        priority: secondary_required
        audience: app_user
        purpose:
          - Toggle between Racing, PFL, and UFC historical rows.
          - Browse races by date.
          - Filter by collected date range, country, discipline, and racecourse.
          - Let users open a three-column scrolling day/month/year selector of available Historical Data dates from the date label, while retaining previous/next arrows and quick presets for today, yesterday, last 7 available dates, and all available dates.
          - Compare field size, favourite, MarketMover, result, and payouts.
          - Load the latest 20 races across AUS/NZ/HK by default and query Supabase when filters change.
          - Browse PFL and UFC fights by event-date range with fighter names, winner, favourite, favourite price, other fighter price, price difference, source match status, and $1 favourite return state.
        components:
          - sport_selector
          - collected_date_range_picker
          - latest_20_race_supabase_result_set
          - latest_20_ufc_fight_supabase_result_set
          - country_filter
          - discipline_filter
          - racecourse_filter
          - saved_track_quick_filter
          - favourite_track_save_remove_control
          - meeting_groups
          - race_list
          - ufc_fight_list
          - empty_state
          - partial_data_state
        entry_points:
          - main_navigation_from_insights
          - date_change
          - insight_filter
        links_to:
          - race_detail
          - insights
          - recommendations
          - account

      account:
        label: Account
        priority: required
        audience: app_user
        purpose:
          - Sign in with Google through Supabase Auth.
          - Show the current signed-in email or display name.
          - Sign out of the persisted Supabase session.
          - Manage saved favourite tracks.
          - Review manually tracked promo-bet performance.
          - Maintain a manual personal balance ledger.
        components:
          - google_sign_in_button
          - signed_in_identity
          - sign_out_button
          - current_balance_card
          - initial_balance_setup_form
          - balance_deposit_control
          - balance_withdrawal_control
          - manual_balance_update_control
          - balance_history_line_graph
          - recent_balance_event_list
          - favourite_track_management_list
          - favourite_track_remove_control
          - tracked_promo_bet_bookmaker_toggle
          - tracked_promo_bet_summary
          - tracked_promo_bet_return_by_discipline
          - tracked_promo_bet_history_list
          - tracked_promo_bet_remove_control
          - auth_error_state
        entry_points:
          - main_navigation
        links_to:
          - race_days
          - insights
          - predictions
          - recommendations

      race_detail:
        label: Race Detail
        priority: required
        audience: app_user
        purpose:
          - Explain one race outcome clearly.
          - Show how favourite and MarketMover were selected.
          - Show final results and dividends.
        components:
          - race_summary
          - field_summary
          - market_summary
          - result_summary
          - runner_table
          - source_status_panel
        entry_points:
          - race_list_row
          - insight_summary_row
          - source_mapping
        links_to:
          - race_days
          - source_status

      insights:
        label: Insights
        priority: required
        audience: app_user
        purpose:
          - Act as the default app landing page.
          - Toggle between Racing, NRL, NPC, PFL, and UFC insight views.
          - Summarise favourite and MarketMover outcomes.
          - Show favourite win, 2nd, and 3rd percentages across collected history.
          - Break favourite finish-position percentages down by final starter count.
          - Break favourite win percentage down by 50c fixed-win price bucket.
          - Break favourite performance down by average fixed-win price of the other priced starters.
          - Show notional $1 favourite return metrics by racing discipline.
          - Show cash-only $1 favourite place-return metrics by racing discipline, separate from bonus-bet credit and cash-plus-bonus value.
          - Split the Insights body into Win and Place tabs below the discipline filter so win-return and place-return statistics stay separate.
          - Show Place tab starter-count and favourite-price breakdowns using place hit rate, place cash average, place cash net, and missing place-dividend counts.
          - Filter return, starter-count, favourite-price, and other-starters average fixed-win breakdowns by discipline, all countries or one selected country, then by all tracks or one selected track inside that country.
          - Let users request public odds for all races when one track and one discipline are selected, for manual comparison with account-visible hidden promos.
          - Read stored Supabase aggregates instead of calculating historical insight tables in the app.
          - For NRL, show fixed-win single aggregate rows by home team, away team, favourite, favourite at home, favourite away, Favourite/Home/Away toggles for fixed-win price bucket, other-team fixed-win price bucket, and price-difference bucket rows, plus a 50c/25c bucket-size toggle for price rows, round, official try-scorer percentage rows by player, team, and captured try-scorer price bucket, and Same Game % summary/round rows for favourite-team plus top-two try-scorer multis from nrl_insight_aggregates.
          - For NPC, show the same NRL-shaped fixed-win aggregate rows, Favourite/Home/Away fixed-win price toggles, and 50c/25c price bucket-size toggle from npc_insight_aggregates, plus source-backed try-scorer percentage rows and Same Game % rows from official RU7 player events and captured TAB try-scorer prices.
          - Show the NRL Same Game % section before the NRL fixed-win and try-scorer singles sections.
          - For UFC, show favourite price breakdown, other fighter price breakdown, and price-difference breakdown from ufc_insight_aggregates.
          - For PFL, show favourite price breakdown, other fighter price breakdown, and price-difference breakdown from pfl_insight_aggregates.
          - Surface missing-data counts.
          - Link users back to filtered race lists and race details.
        components:
          - sport_selector
          - date_range_filter
          - country_filter
          - discipline_filter
          - racecourse_filter
          - track_scope_filter
          - saved_track_quick_filter
          - favourite_track_save_remove_control
          - track_race_odds_request_panel
          - full_collected_date_range_default
          - discipline_summary_sections
          - insight_win_place_tabs
          - favourite_outcomes
          - favourite_finish_position_percentages
          - unit_stake_return_metrics
          - place_unit_stake_return_metrics
          - bonus_average_return_metric
          - starter_count_breakdown
          - place_starter_count_breakdown
          - favourite_price_bucket_breakdown
          - place_favourite_price_bucket_breakdown
          - other_starters_average_fixed_win_breakdown
          - ufc_favourite_price_breakdown
          - ufc_other_fighter_price_breakdown
          - ufc_price_difference_breakdown
          - market_mover_outcomes
          - missing_data_counts
          - denominator_counts
          - track_race_runner_odds
          - track_race_favourite_and_market_mover_flags
          - track_race_default_cash_average_score_signal
          - track_race_cash_plus_bonus_average_context
        limits:
          - no_stake_sizing
          - no_bankroll_guidance
          - no_automated_wagering
          - no_account_credential_storage
          - no_push_notifications_until_ingestion_is_reliable
        entry_points:
          - app_launch
          - main_navigation
        links_to:
          - recommendations
          - race_days
          - race_detail

      recommendations:
        label: Recommendations
        priority: required
        audience: app_user
        purpose:
          - Show current public TAB and Betcha race-specific promotion signals.
          - Keep all fetched public promotions available for source diagnostics, not the normal frontend list.
          - Match race-specific promotions to current race cards.
          - Show current favourite, fixed-win price, starter count, and MarketMover where available.
          - Compare current race facts with historical starter-count and price-bucket statistics.
          - Surface statistical signals without stake sizing or automated wagering.
        components:
          - provider_filter
          - supabase_snapshot_status
          - racing_promotion_cards
          - current_race_card_facts
          - favourite_price_signal
          - starter_count_historical_signal
          - price_bucket_historical_signal
          - cash_plus_bonus_average_signal
          - starter_bucket_metric
          - track_bet_control
          - promotion_cache_age_status
          - refresh_recommendations_control
          - historical_signal_basis_label
          - broad_promotion_list
          - missing_price_state
        limits:
          - no_stake_sizing
          - no_bankroll_guidance
          - no_bookmaker_balance_connection
          - no_automated_wagering
          - no_invented_prices_or_favourites
        entry_points:
          - main_navigation
          - insight_summary_row
        links_to:
          - race_days
          - race_detail
          - predictions

      predictions:
        label: Predictions
        priority: required
        audience: app_user
        purpose:
          - Show current ranked sport-specific prediction signals from the latest stored current prediction source.
          - Split current prediction branches into Sport, Singles/Multis format, Cash/Win %/Placing signal type, and model tabs so different signal families are not mixed together.
          - Keep current candidates separate from Prediction History so today's snapshot is not confused with settled outcomes.
          - Show shared Sport tabs for Racing, NRL, NPC, PFL, and UFC, then format tabs for Singles and Multis, then Cash, Win %, and Placing signal tabs, then only model tabs matching the selected sport/format/signal branch.
          - Show the same cash prediction model list under Racing Singles -> Cash and Racing Multis -> Cash: Global bucket blend, Global cash bucket blend, Global cash 50/50 blend, Global cash price only, Global cash starters only, Other starters avg price, Country + discipline blend, and Distance + condition blend.
          - Show the cash prediction model selector and method summary only for cash-model branches.
          - Show horse, harness, and greyhound cash candidates in discipline tabs so the mobile page does not become a long stacked list.
          - Show compact horse, harness, or greyhound discipline icons beside cash candidate race title and runner lines.
          - Show cash candidate status pills with the active model cash metric basis, such as Positive cash blend or Weak price cash.
          - Show a compact signal guide above cash candidate cards that explains the active prediction model's cash-score formula and Positive, Neutral, Weak, Small sample, and Limited history meanings.
          - Label cash candidate bucket cash average and cash-plus-bonus average separately so bonus context is not mistaken for the recommendation score.
          - Under Racing Singles -> Cash, show ranked individual candidates only. Under Racing Multis -> Cash, show only the Multi bet recommendation panel derived from the active cash model's current candidate snapshot; prefer three or more Positive priced legs, otherwise use three or more Positive-or-Neutral priced legs.
          - Show a Placing recommendations panel under the Placing type, derived from stored place-rate insight aggregates; exclude fields with no place market.
          - Show current placing recommendation cash-average score plus favourite price bucket and starter-count bucket context.
          - Show single_win_percentage_60_plus_v1 and single_win_percentage_65_plus_v1 under Racing Singles -> Win %, listing every current favourite with a blended historical win score of at least the selected threshold as a separate tracked $1 single.
          - >
            Show a percentage multi recommendation panel under Racing Multis -> Win %.
            Win-rate models use 65% favourite price-bucket win rate and 35%
            starter-count win rate, falling back to per-candidate historical
            buckets when a cached snapshot predates the backend
            winPercentageMultiCandidates field. The placing model uses 65%
            favourite price-bucket place rate and 35% starter-count place rate,
            excludes races without an active place market, and does not show
            place-multi payout odds.
          - >
            Show a Win % model selector with the original
            multi_win_percentage_blend_v1 two-to-five-leg model and stricter
            multi_win_percentage_60_plus_v1 and
            multi_win_percentage_65_plus_v1 models that keep only 60%+ or 65%+
            65/35 win-score legs, plus multi_win_percentage_50_50_65_plus_v1
            for a 50/50 price-bucket and starter-count 65%+ threshold.
            Threshold models can generate with a minimum
            of two legs and show up to 10 legs, plus
            multi_place_percentage_v1 with up to eight
            place-rate legs.
          - Show UFC 65%+, 75%+, and 85%+ single threshold model tabs under UFC Singles -> Win % alongside the existing UFC favourite-price, other-fighter-price, and price-difference single model tabs. Threshold singles list fully priced Head to Head favourites whose strongest UFC historical win-percentage signal is at least the selected threshold.
          - Show PFL favourite-price, other-fighter-price, price-difference, 65%+, 75%+, and 85%+ Win % model tabs under the same PFL Singles/Multis hierarchy as UFC, with explicit reserved empty states until PFL historical aggregates, current fight-card collection, and PFL-specific persistence are added.
          - Show the UFC same-card percentage model selector under UFC Multis -> Win %, using favourite price, other fighter price, other fighter price top-six, and price-difference bucket models.
          - Show NRL fixed-win percentage and try-scorer percentage model tabs under NRL Singles -> Win %, reading current rows from nrl_single_predictions.
          - Show NPC fixed-win percentage and try-scorer percentage model tabs under NPC Singles -> Win %, reading current rows from npc_single_predictions. Fixed-win rows use current TAB Match Betting favourites; try-scorer rows use official RU7 player/team try rates and current TAB Anytime Try Scorer prices where entrants match official player IDs.
          - UFC non-Win % branches should remain selectable but show explicit empty states until matching models are added.
          - NRL Multis -> Same Game % should expose the favourite-team plus top-two try-scorer model once same-game multi result rows exist; other unsupported NRL branches should remain selectable but show explicit empty states until matching cash or same-game models are added.
          - NPC unsupported branches should remain selectable but show explicit empty states until matching cash, placing, or same-game models are added.
          - Show a visible Prediction finalises before timestamp near the top of Predictions, calculated as 15 minutes before the selected sport's first race, fight, or match starts.
          - Let signed-in users lock the current selected sport/format/type/model prediction view before that sport's finalisation cutoff; existing percentage multi locks continue to show user-owned snapshots instead of later live recommendation changes for the current source date/model.
          - Show lock cutoff context near every lock action.
          - Show a small Multi tag on prediction variation tabs that have at least one tracked multi-bet prediction row for the current Auckland source date.
          - Track one pre-finalisation multi bet recommendation per prediction model/source date for cash-only historical outcomes.
          - >
            Track dedicated percentage multi-only models separately from
            single-runner prediction models, including
            multi_win_percentage_blend_v1, multi_win_percentage_60_plus_v1, and
            multi_win_percentage_65_plus_v1,
            multi_win_percentage_50_50_65_plus_v1, plus
            multi_place_percentage_v1.
          - Track candidate predictions made by independent current prediction scans.
          - Compare stored predictions with settled race outcomes after race-day refreshes.
          - Compare prediction variations in parallel without mixing model denominators.
          - Include a global cash bucket blend variation that uses 65% favourite price-bucket cash average plus 35% starter-count cash average and excludes bonus-credit value.
          - Include a global cash 50/50 blend variation that uses equal favourite price-bucket and starter-count cash averages and excludes bonus-credit value.
          - Include a global cash price-only variation that uses 100% favourite price-bucket cash average and excludes bonus-credit value.
          - Include a global cash starter-count-only variation that uses 100% final starter-count cash average and excludes bonus-credit value.
          - Include an other-starters average price variation that uses 100% of the matching other-starters average fixed-win price bucket cash average and excludes $70.00+ other-starter outlier prices from the average.
          - Keep median other-starter fixed-win price as a planned follow-up field-shape signal.
          - Order current bet candidates by the active prediction variation's model-specific cashAverageScore; cash-plus-bonus remains visible as supporting context but must not drive recommendations.
          - Use the current Auckland source date's pre-finalisation prediction snapshot for current bet candidates; show a closed-window empty state if the sport-specific finalisation cutoff has passed and no same-day snapshot exists.
          - Exclude source races marked abandoned or cancelled from current Bet candidates and Multi bet recommendations.
          - Render an existing closed-window current prediction snapshot immediately instead of attempting a stale-cache refresh that cannot replace the finalised snapshot.
          - Keep prediction tracking statistical only, with no stake sizing or wagering action.
        components:
          - prediction_type_tabs
          - cash_prediction_variation_tabs
          - win_percentage_multi_model_tabs
          - prediction_variation_method_summary
          - current_bet_candidates_section
          - current_bet_candidates
          - bet_candidate_discipline_tabs
          - bet_candidate_estimated_cash_return_per_dollar_metric
          - bet_candidate_other_starters_average_fixed_win_metric
          - multi_bet_recommendation_panel
          - win_percentage_multi_recommendation_panel
          - win_percentage_multi_lock_control
          - placing_recommendations_panel
          - bet_candidate_refresh_control
          - bet_candidate_track_control
        limits:
          - no_stake_sizing
          - no_bankroll_guidance
          - no_automated_wagering
        entry_points:
          - main_navigation
          - recommendations
        links_to:
          - prediction_history
          - recommendations
          - race_days

      prediction_history:
        label: Prediction History
        priority: required
        audience: app_user
        purpose:
          - Compare stored predictions with settled race outcomes after race-day refreshes.
          - Show prediction performance using the same notional $1 cash-plus-bonus return metrics used by Insights.
          - Let prediction variations run in parallel and compare performance without mixing model denominators.
          - Keep itemised prediction history out of the current Predictions tab.
          - Filter Stored model performance by all, horse, harness, or greyhound; all ranks, top 1, top 2, or top 3; and all signals, positive only, or neutral or better.
          - Treat neutral or better as Positive candidate or Neutral candidate only, excluding Small sample and Limited history.
          - Show discipline prediction performance by racing code, including cash average, cash net, and cash-plus-bonus net, with average returns displayed as dollar value per $1 prediction.
          - Show recent stored prediction history with race, runner, price, status, cash returns, and bonus-bet credits.
          - Style settled Prediction history outcome badges so cash wins are positive and 2nd/3rd bonus-credit outcomes are yellow bonus-bet labels, not generic value labels.
          - Order Prediction history rows by outcome before time: wins first, then 2nd, then 3rd, then other settled losses, then unresolved rows.
          - Filter only the prediction history list by date range, country, discipline, and racecourse.
          - Default and reset the Prediction history date range to yesterday in Pacific/Auckland time, even when no rows exist for that date yet.
          - Let users open a three-column scrolling day/month/year selector of available Prediction history dates from the date label, while retaining previous/next arrows and quick presets for today, yesterday, last 7 available dates, and all available dates.
          - Show a date range breakdown for the selected Prediction history filters with prediction count, settled/pending count, win rate, cash average, cash net, cash-plus-bonus average, cash-plus-bonus net, and open issues.
          - Show Placing prediction performance in Stored model performance using country-aware starter-count place rules.
          - Include place cash average, place cash net, and missing place-dividend counts in Placing prediction performance.
          - Show selected-model all-time tracked Multi-bet prediction performance inside Stored model performance, with multi-bet prediction count, settled/pending count, win rate, cash average, cash net, and open issues.
          - Show all-time Multi-bet percentage performance separately from selected-model multi performance.
          - Show shared Sport tabs for Racing, NRL, NPC, PFL, and UFC, then format tabs for Singles and Multis, then Cash, Win %, and Placing signal tabs, then only model tabs matching the selected sport/format/signal branch.
          - Show cash model tabs for Racing Cash singles and multis, 60%+ and 65%+ win singles models for Racing Singles -> Win %, percentage multi model tabs including the 50/50 65%+ model for Racing Multis -> Win %, the place percentage multi model for Racing Multis -> Placing, UFC 65%+, 75%+, and 85%+ threshold model tabs for UFC Singles -> Win %, UFC same-card model tabs for UFC Multis -> Win %, and matching reserved PFL Win % model tabs.
          - UFC Singles -> Win % reads stored `ufc_single_predictions` history through UFC-specific summary and entry RPCs, including the 65%+, 75%+, and 85%+ threshold single models, with racing-only country, discipline, and racecourse filters hidden.
          - PFL Prediction History shows the UFC-shaped PFL Win % model hierarchy as a reserved empty state until PFL prediction storage and RPCs are added.
          - NRL history branches remain explicit empty states until NRL prediction reconciliation and history RPCs are added.
          - NPC history branches remain explicit empty states until official NPC result settlement and NPC history RPCs are added.
          - Show percentage multi model tabs under multi Win % and Placing branches so the original, 60%+, 65%+, 50/50 65%+, and place percentage models can be reviewed independently.
          - Add a local rank filter immediately above Multi-bet percentage performance with All legs plus model-aware top-N options: top 2-5 for the original win-percentage model, top 2-10 for the racing threshold win-percentage models including multi_win_percentage_50_50_65_plus_v1, top 2-8 for multi_place_percentage_v1, top 2-8 for most UFC percentage multi models, and top 2-6 for ufc_multi_other_fighter_price_win_percentage_top6_v1.
          - Show a selected-model Multi bet recommendation date-range breakdown for the selected history filters with recommendation count, settled/pending count, win rate, cash average, cash net, and open issues.
          - Show percentage multi date-range breakdown and history with average win score or place score labels and leg-level Won/Placed/Lost/Missed/Pending/Missing outcomes.
          - Show UFC same-card multi history card dates from the earliest leg advertised start date, while retaining source-date filters and predicted-at labels for the prediction run.
          - Show tracked Multi bet recommendation history with recommendation type, leg count, relevant average score, result label, and per-leg Won/Placed/Lost/Missed/Pending/Missing outcomes.
          - Keep prediction tracking statistical only, with no stake sizing or wagering action.
        components:
          - prediction_sport_tabs
          - prediction_format_tabs
          - prediction_type_tabs
          - prediction_variation_tabs
          - win_percentage_multi_model_tabs
          - prediction_variation_method_summary
          - stored_model_performance_heading
          - stored_model_performance_filters
          - prediction_summary_stats
          - prediction_return_by_discipline
          - prediction_history_list
          - prediction_history_date_range_filter
          - prediction_history_country_filter
          - prediction_history_discipline_filter
          - prediction_history_racecourse_filter
          - prediction_history_date_range_breakdown
          - win_percentage_multi_bet_performance
          - pending_prediction_count
          - missing_prediction_outcome_count
          - supabase_prediction_aggregate_status
        limits:
          - no_stake_sizing
          - no_bankroll_guidance
          - no_automated_wagering
        entry_points:
          - main_navigation
          - predictions
        links_to:
          - predictions
          - recommendations
          - race_days

      source_status:
        label: Source Status
        priority: required_for_operations
        audience: developer_operator
        purpose:
          - Explain ingestion health and data completeness.
          - Help identify parser/source failures.
        components:
          - ingestion_run_list
          - failed_fetch_list
          - race_source_id_mapping
          - missing_market_data_report
          - missing_result_data_report
        mvp_access:
          - hidden_debug_screen
          - supabase_table_view
        links_to:
          - race_detail

      settings:
        label: Settings
        priority: useful
        audience: app_user
        purpose:
          - Store lightweight preferences.
          - Explain data-source context.
        components:
          - default_code_preference
          - default_racecourse_filter
          - data_source_notes
          - app_version_metadata
        links_to:
          - race_days

flows:
  primary_browse_flow:
    - open_app
    - review_insights
    - open_recommendations
    - review_current_promotion_signals
    - review_favourite_win_second_third_percentages
    - review_unit_stake_returns_by_discipline
    - drill_into_starter_count_breakdown
    - open_race_days_when_needed
    - filter_date_country_discipline_or_racecourse
    - scan_race_list
    - open_race_detail
    - check_favourite_placing_and_dividends
    - return_to_insights_or_adjust_filters

  operator_quality_flow:
    - open_source_status
    - review_failed_fetches
    - inspect_race_source_mapping
    - open_affected_race_detail
    - rerun_or_backfill_outside_app

screen_data_relationships:
  race_days:
    reads:
      - race_day_entries
      - ufc_fight_entries
    core_tables:
      - meetings
      - races
      - runners
      - odds_snapshots
      - race_results
      - race_dividends
      - ufc_fight_entries

  race_detail:
    reads:
      - race_day_entries
      - race_market_state
      - debug/admin views
    core_tables:
      - races
      - runners
      - odds_snapshots
      - race_results
      - race_dividends
      - source_fetches

  insights:
    reads:
      - insight_aggregates
      - nrl_insight_aggregates
      - ufc_insight_aggregates
      - race_day_entries
      - track_race_odds_requests
    core_tables:
      - meetings
      - races
      - odds_snapshots
      - race_results
      - runners
      - nrl_fixed_win_snapshot_results
      - nrl_player_match_appearances
      - nrl_try_scorers
      - ufc_fight_entries

  recommendations:
    reads:
      - current_promotion_snapshots
      - promotion_recommendations
      - insight_aggregates
      - race_day_entries
    core_tables:
      - promotions
      - races
      - runners
      - odds_snapshots
      - source_fetches

  predictions:
    reads:
      - current_prediction_snapshots
    core_tables:
      - races
      - runners

  prediction_history:
    reads:
      - prediction_aggregates
      - promotion_predictions
      - multi_bet_recommendations
      - multi_bet_recommendation_legs
    core_tables:
      - races
      - runners
      - race_results

  source_status:
    reads:
      - debug/admin views
    core_tables:
      - source_fetches
      - ingestion_runs
      - races

content_rules:
  - Race list rows should show missing favourite, MarketMover, result, or
    dividend data as explicit unavailable states.
  - Historical Data should remain a separate page from Insights and provide a
    Racing/PFL/UFC sport selector. Racing should provide date, country, discipline,
    and racecourse filters. It should load the latest 20 races across AUS/NZ/HK
    from Supabase by default, then query Supabase with selected filters. PFL and
    UFC should provide event-date filtering and load the latest 20 fights from
    pfl_fight_entries or ufc_fight_entries by default.
  - Race Detail should show the snapshot timestamp used for favourite/MM when
    the data came from pre-race odds.
