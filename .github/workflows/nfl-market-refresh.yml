name: NFL Market Refresh

on:
  schedule:
    # Broad UTC windows around common NFL kickoff days; captures open TAB Head To Head prices before kickoff.
    - cron: "*/30 0-4,16-23 * * 0,1,4,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and summarize NFL markets without writing
        required: false
        default: false
        type: boolean
      event_count:
        description: Number of open NFL payload events to scan
        required: true
        default: "20"
        type: string
      markets_first:
        description: Open markets to request per event
        required: true
        default: "500"
        type: string
      season:
        description: Optional nflverse NFL fixture preload season
        required: false
        type: string
      round:
        description: Optional nflverse NFL fixture preload week
        required: false
        type: string
      from_round:
        description: Optional nflverse NFL fixture preload start week
        required: false
        type: string
      to_round:
        description: Optional nflverse NFL fixture preload end week
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nfl-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh NFL Current Markets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      EVENT_COUNT: ${{ github.event.inputs.event_count }}
      FEELING_GAMBA_SUPABASE_SECRET_KEY: ${{ secrets.FEELING_GAMBA_SUPABASE_SECRET_KEY }}
      FROM_ROUND: ${{ github.event.inputs.from_round }}
      MARKETS_FIRST: ${{ github.event.inputs.markets_first }}
      ROUND: ${{ github.event.inputs.round }}
      SEASON: ${{ github.event.inputs.season }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      TO_ROUND: ${{ github.event.inputs.to_round }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate required inputs and secrets
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF is required" && exit 1)

          dry_run="${DRY_RUN:-false}"
          supabase_write_key="${FEELING_GAMBA_SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"

          if [ "$dry_run" != "true" ] && [ -z "$supabase_write_key" ]; then
            echo "FEELING_GAMBA_SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required for NFL market writes"
            exit 1
          fi

          EVENT_COUNT="${EVENT_COUNT:-20}"
          MARKETS_FIRST="${MARKETS_FIRST:-500}"

          for input_name in EVENT_COUNT MARKETS_FIRST; do
            input_value="${!input_name:-}"

            case "$input_value" in
              ''|*[!0-9]*)
                echo "${input_name} must be a positive integer"
                exit 1
                ;;
            esac

            if [ "$input_value" -lt 1 ]; then
              echo "${input_name} must be a positive integer"
              exit 1
            fi
          done

          if [ -n "${ROUND:-}" ] && { [ -n "${FROM_ROUND:-}" ] || [ -n "${TO_ROUND:-}" ]; }; then
            echo "Pass either round or from_round/to_round, not both"
            exit 1
          fi

          if { [ -n "${FROM_ROUND:-}" ] && [ -z "${TO_ROUND:-}" ]; } || { [ -z "${FROM_ROUND:-}" ] && [ -n "${TO_ROUND:-}" ]; }; then
            echo "Pass both from_round and to_round"
            exit 1
          fi

          if { [ -n "${ROUND:-}" ] || [ -n "${FROM_ROUND:-}" ]; } && [ -z "${SEASON:-}" ]; then
            echo "season is required when preloading nflverse NFL fixtures"
            exit 1
          fi

      - name: Refresh current NFL market data
        run: |
          args=(
            "--event-count=${EVENT_COUNT:-20}"
            "--markets-first=${MARKETS_FIRST:-500}"
          )

          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=("--dry-run")
          else
            args+=("--require-supabase")
          fi

          if [ -n "${SEASON:-}" ]; then
            args+=("--season=${SEASON}")
          fi

          if [ -n "${ROUND:-}" ]; then
            args+=("--round=${ROUND}")
          fi

          if [ -n "${FROM_ROUND:-}" ]; then
            args+=("--from-round=${FROM_ROUND}" "--to-round=${TO_ROUND}")
          fi

          npm --workspace @feeling-gamba/ingestion run refresh:nfl-current-markets -- "${args[@]}"
