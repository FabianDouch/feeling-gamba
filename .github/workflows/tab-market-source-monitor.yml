name: TAB Market Source Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

# Serialize incident creation/closure to prevent duplicate notifications.
concurrency:
  group: tab-market-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Reconcile shared TAB source incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/monitor-tab-market-source.mjs
