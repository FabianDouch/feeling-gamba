name: MLS Result Refresh

on:
  schedule:
    # Post-match MLS weekend and midweek catch-up passes. GitHub cron uses UTC and may be delayed.
    - cron: "30 14,17,20,22,23 * * 5,6,0,1,2,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and summarize MLS results without writing
        required: false
        default: false
        type: boolean
      include_fixtures:
        description: Include future fixtures so market snapshots can match upcoming MLS matches
        required: false
        default: true
        type: boolean
      season:
        description: MLS season start year
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mls-result-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh MLS Results And Insights
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      FEELING_GAMBA_SUPABASE_SECRET_KEY: ${{ secrets.FEELING_GAMBA_SUPABASE_SECRET_KEY }}
      INCLUDE_FIXTURES: ${{ github.event.inputs.include_fixtures }}
      SEASON: ${{ github.event.inputs.season }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate required inputs and secrets
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF is required" && exit 1)

          default_mls_season() {
            year="$(date -u +%Y)"
            month="$(date -u +%m)"

            if [ "$month" -ge 7 ]; then
              echo "$year"
            else
              echo "$((year - 1))"
            fi
          }

          dry_run="${DRY_RUN:-false}"
          season="${SEASON:-$(default_mls_season)}"
          supabase_write_key="${FEELING_GAMBA_SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"

          case "$season" in
            ''|*[!0-9]*)
              echo "season must be a positive integer"
              exit 1
              ;;
          esac

          if [ "$season" -lt 2000 ]; then
            echo "season must be a four-digit year"
            exit 1
          fi

          if [ "$dry_run" != "true" ] && [ -z "$supabase_write_key" ]; then
            echo "FEELING_GAMBA_SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required for MLS result writes"
            exit 1
          fi

      - name: Refresh recent MLS result rows and insights
        run: |
          default_mls_season() {
            year="$(date -u +%Y)"
            month="$(date -u +%m)"

            if [ "$month" -ge 7 ]; then
              echo "$year"
            else
              echo "$((year - 1))"
            fi
          }

          args=(
            "--season=${SEASON:-$(default_mls_season)}"
            "--priced-only"
          )

          if [ "${INCLUDE_FIXTURES:-true}" != "true" ]; then
            args+=("--no-include-fixtures")
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=("--dry-run")
          else
            args+=("--require-supabase")
          fi

          npm --workspace @feeling-gamba/ingestion run refresh:mls-results-and-insights -- "${args[@]}"
