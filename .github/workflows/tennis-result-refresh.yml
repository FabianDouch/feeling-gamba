name: Tennis Result Refresh

on:
  schedule:
    # Repeated ATP/WTA post-match catch-up passes. GitHub cron uses UTC and may be delayed.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and summarize Tennis results without writing
        required: false
        default: false
        type: boolean
      days_from:
        description: Completed-score lookback days for The Odds API
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: tennis-result-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Tennis Results And Insights
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DAYS_FROM: ${{ github.event.inputs.days_from }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      FEELING_GAMBA_SUPABASE_SECRET_KEY: ${{ secrets.FEELING_GAMBA_SUPABASE_SECRET_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate required inputs and secrets
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "SUPABASE_PROJECT_REF is required" && exit 1)
          test -n "$ODDS_API_KEY" || (echo "ODDS_API_KEY is required" && exit 1)

          days_from="${DAYS_FROM:-3}"
          dry_run="${DRY_RUN:-false}"
          supabase_write_key="${FEELING_GAMBA_SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"

          case "$days_from" in
            ''|*[!0-9]*)
              echo "days_from must be a positive integer"
              exit 1
              ;;
          esac

          if [ "$days_from" -lt 1 ] || [ "$days_from" -gt 7 ]; then
            echo "days_from must be between 1 and 7"
            exit 1
          fi

          if [ "$dry_run" != "true" ] && [ -z "$supabase_write_key" ]; then
            echo "FEELING_GAMBA_SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY is required for Tennis result writes"
            exit 1
          fi

      - name: Refresh recent Tennis result rows and insights
        run: |
          args=(
            "--days-from=${DAYS_FROM:-3}"
          )

          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=("--dry-run")
          else
            args+=("--require-supabase")
          fi

          npm --workspace @feeling-gamba/ingestion run refresh:tennis-results-and-insights -- "${args[@]}"
